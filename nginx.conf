server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  charset utf-8;

  # custom 404 page
  error_page 404 /404.html;
  location = /404.html {
    internal;
    add_header Cache-Control "no-store" always;
  }

  location / {
    add_header Cache-Control "no-store" always;
    try_files $uri $uri/ =404;
  }
}
